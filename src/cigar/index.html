<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Персонаж · 3D</title>
<style>
  :root{
    --ink:#241a2e;
    --panel:rgba(255,255,255,.72);
    --line:rgba(36,26,46,.14);
    --accent:#ff7a3d;
    --bg1:#ffffff;
    --bg2:#fbf9f5;
    --bg3:#efeae1;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 100% at 50% 6%, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%);
    transition:background .5s ease;
    -webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #c.dragging{cursor:grabbing}

  .hud{
    position:fixed;top:0;left:0;padding:26px 30px;pointer-events:none;
    display:flex;flex-direction:column;gap:6px;
    opacity:0;animation:rise .8s .15s ease forwards;
  }
  .hud .kicker{font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.55}
  .hud .title{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.04}
  .hud .title em{font-style:normal;color:var(--accent)}
  .hud .sub{font-size:12.5px;opacity:.62}

  .bar{
    position:fixed;right:26px;bottom:26px;
    display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 18px 40px -20px rgba(60,30,90,.5);
    opacity:0;animation:rise .8s .4s ease forwards;
  }
  .bar button{
    appearance:none;border:0;background:transparent;color:var(--ink);
    font:inherit;font-size:12.5px;padding:11px 15px;min-height:40px;border-radius:999px;
    cursor:pointer;transition:background .16s ease,color .16s ease;white-space:nowrap;
  }
  .bar button:hover{background:rgba(36,26,46,.08)}
  .bar button.on{background:rgba(255,122,61,.18);color:#b23f10;box-shadow:inset 0 0 0 1px rgba(255,122,61,.45)}
  .bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .dots{display:flex;gap:6px;padding:0 6px}
  .dots i{
    width:22px;height:22px;border-radius:50%;cursor:pointer;display:block;
    border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(60,30,90,.3);
    transition:transform .15s ease;
  }
  .dots i:hover{transform:scale(1.12)}

  .hint{
    position:fixed;left:30px;bottom:30px;max-width:46ch;text-align:left;line-height:1.6;
    font-size:11.5px;letter-spacing:.05em;opacity:.5;pointer-events:none;
    opacity:0;animation:rise .9s .6s ease forwards;
  }
  .hint kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin:0 1px}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.9;transform:translateY(0)}}
  @keyframes riseBar{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  @media (max-width:720px){
    .hud{padding:18px}
    .hud .title{font-size:21px}
    .hint{display:none}
    .bar{bottom:14px;right:14px;gap:2px;padding:5px;flex-wrap:wrap;max-width:60vw;justify-content:flex-end}
    .bar button{padding:10px 11px;font-size:11.5px}
    .dots i{width:18px;height:18px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header class="hud">
  <div class="kicker">3D-модель</div>
  <div class="title">Сигара <em>3D</em></div>
  <div class="sub">Мультяшный маскот · табачный лист, пепел, toon-шейдинг</div>
</header>

<div class="hint">
  Тяните мышью — вращение · колесо — зум · клик по персонажу — «затяжка» · <kbd>R</kbd> вращение · <kbd>S</kbd> дым
</div>

<div class="bar">
  <button data-act="spin">Авто-вращение</button>
  <button data-act="smoke" class="on">Дым</button>
  <span class="sep"></span>
  <div class="dots">
    <i data-bg="peach" style="background:linear-gradient(135deg,#ffe9c7,#ffe0ef)"></i>
    <i data-bg="mint" style="background:linear-gradient(135deg,#d8f6e8,#cfe9ff)"></i>
    <i data-bg="lilac" style="background:linear-gradient(135deg,#e8dcff,#ffd9ec)"></i>
    <i data-bg="night" style="background:linear-gradient(135deg,#2b2246,#4a2f6b)"></i>
  </div>
</div>

<script>/*__THREE__*/</script>
<script>
(function(){
"use strict";

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 40);

/* ---------------------------------------------------------------- toon */
function toonRamp(){
  const stops = [70, 140, 205, 255];
  const data = new Uint8Array(stops.length * 4);
  for (let i = 0; i < stops.length; i++){
    data[i*4] = data[i*4+1] = data[i*4+2] = stops[i];
    data[i*4+3] = 255;
  }
  const t = new THREE.DataTexture(data, stops.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = toonRamp();
function toon(color, opts){
  return new THREE.MeshToonMaterial(Object.assign({color:color, gradientMap:RAMP}, opts || {}));
}
const OUTLINE_MAT = new THREE.ShaderMaterial({
  uniforms:{thickness:{value:.0035}, color:{value:new THREE.Color(0x2a1b33)}},
  vertexShader:'uniform float thickness; void main(){ vec3 p = position + normal * thickness; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
  fragmentShader:'uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); }',
  side:THREE.BackSide
});

/* ---------------------------------------------------------------- helpers */
function cv(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return {c, g:c.getContext('2d')};
}
/* бумага: вертикальные волокна и скрутка */
function paperTexture(){
  const {c, g} = cv(512, 512);
  const grd = g.createLinearGradient(0, 0, 512, 0);
  grd.addColorStop(0, '#9c4d0e'); grd.addColorStop(.16, '#f0911c');
  grd.addColorStop(.42, '#ffcb4d'); grd.addColorStop(.58, '#ffe37f');
  grd.addColorStop(.8, '#ffa428'); grd.addColorStop(1, '#a4510c');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 120; i++){
    const x = Math.random() * 512;
    g.strokeStyle = 'rgba(' + (Math.random() < .5 ? '112,56,6,' : '255,240,190,') + (.04 + Math.random() * .11) + ')';
    g.lineWidth = .6 + Math.random() * 2.6;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (Math.random() - .5) * 8, 512); g.stroke();
  }
  // шов скрутки
  const seam = g.createLinearGradient(352, 0, 392, 0);
  seam.addColorStop(0, 'rgba(150,80,10,0)');
  seam.addColorStop(.5, 'rgba(150,80,10,.35)');
  seam.addColorStop(1, 'rgba(150,80,10,0)');
  g.fillStyle = seam; g.fillRect(352, 0, 40, 512);
  g.strokeStyle = 'rgba(255,248,214,.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(348, 0); g.lineTo(348, 512); g.stroke();
  // тень скрутки у края
  const sh = g.createLinearGradient(400, 0, 512, 0);
  sh.addColorStop(0, 'rgba(150,80,10,0)'); sh.addColorStop(1, 'rgba(150,80,10,.22)');
  g.fillStyle = sh; g.fillRect(400, 0, 112, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
function softShadowTex(){
  const {c, g} = cv(256, 128);
  const grd = g.createRadialGradient(128, 64, 0, 128, 64, 120);
  grd.addColorStop(0, 'rgba(52,26,72,.85)');
  grd.addColorStop(.42, 'rgba(52,26,72,.48)');
  grd.addColorStop(1, 'rgba(70,40,90,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 128);
  return new THREE.CanvasTexture(c);
}

function roundedBox(w, h, d, r, seg){
  r = Math.min(r, w * .49, h * .49, d * .49);
  seg = seg || 3;
  const s = new THREE.Shape();
  const hw = w / 2, hh = h / 2;
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + r);
  s.lineTo(hw, hh - r); s.quadraticCurveTo(hw, hh, hw - r, hh);
  s.lineTo(-hw + r, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - r);
  s.lineTo(-hw, -hh + r); s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  const depth = Math.max(d - 2 * r, .001);
  const g = new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled:true, bevelSize:r * .92, bevelThickness:r,
    bevelSegments:seg, curveSegments:8, steps:1
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}
function add(mesh, parent){
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function box(w, h, d, mat, x, y, z, parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x || 0, y || 0, z || 0);
  return add(m, parent || scene);
}
function rbox(w, h, d, r, mat, x, y, z, parent){
  const m = new THREE.Mesh(roundedBox(w, h, d, r), mat);
  m.position.set(x || 0, y || 0, z || 0);
  return add(m, parent || scene);
}
function cyl(rt, rb, h, mat, seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 24), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function ball(r, mat, seg){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg || 24, (seg || 24) * .66), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* палочка между двумя точками */
const _up = new THREE.Vector3(0, 1, 0);
function stick(p1, p2, r, mat, parent){
  const a = new THREE.Vector3().fromArray(p1);
  const b = new THREE.Vector3().fromArray(p2);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = cyl(r, r, len, mat, 14);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(_up, dir.clone().normalize());
  m.castShadow = true;
  (parent || scene).add(m);
  return m;
}

/* ---------------------------------------------------------------- materials */
const paperTex = paperTexture();
const M = {
  paper:   toon(0xffffff, {map:paperTex}),
  cherryA: toon(0x585049),
  cherryB: toon(0x1c1917),
  cherryC: toon(0x746b61),
  cherryD: toon(0x2b2521),
  ember:   new THREE.MeshBasicMaterial({color:0xff6a1e}),
  dark:    toon(0x3a2318),
  black:   toon(0x191520),
  lens:    toon(0x1a1a26),
  white:   toon(0xffffff),
  cream:   toon(0xfff3dd),
  shoe:    toon(0x2b1b12),
  glove:   toon(0xffffff),
  limb:    toon(0x6b4026),
  smoke:   new THREE.MeshToonMaterial({color:0xe9e2dc, gradientMap:RAMP, transparent:true, opacity:.55, depthWrite:false}),
};

/* ---------------------------------------------------------------- character */
const hero = new THREE.Group();
hero.position.y = .06;
scene.add(hero);

/* --- тело: скрученная бумага --- */
const bodyGeo = new THREE.CylinderGeometry(.178, .120, 1.14, 34, 16);
(function bend(){
  const p = bodyGeo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const y = p.getY(i);
    const t = (y + .57) / 1.14;
    p.setX(i, p.getX(i) + Math.sin(t * Math.PI) * .010);
    p.setZ(i, p.getZ(i) * (.965 + .035 * t));
  }
  p.needsUpdate = true;
  bodyGeo.computeVertexNormals();
})();
const body = new THREE.Mesh(bodyGeo, M.paper);
body.position.y = .955;
add(body, hero);

// радиус тела на заданной высоте
function bodyRadius(y){
  const t = Math.min(1, Math.max(0, (y - .385) / 1.14));
  return .120 + (.178 - .120) * t;
}

/* --- верхушка (бошка) --- */
const cherry = new THREE.Group();
cherry.position.y = 1.525;
hero.add(cherry);

const dome = new THREE.Mesh(new THREE.SphereGeometry(.176, 30, 16, 0, Math.PI * 2, 0, Math.PI * .62), M.cherryA);
dome.scale.set(1, .95, 1);
add(dome, cherry);

const budMats = [M.cherryA, M.cherryB, M.cherryC, M.cherryD];
for (let i = 0; i < 34; i++){
  const a = i / 34 * Math.PI * 2 + Math.random() * .5;
  const rad = .175 * (.25 + Math.random() * .72);
  const h = .175 * Math.sqrt(Math.max(0, 1 - Math.pow(rad / .175, 2))) * .95;
  const b = ball(.018 + Math.random() * .030, budMats[i % budMats.length], 12);
  b.position.set(Math.cos(a) * rad, h * (.55 + Math.random() * .55), Math.sin(a) * rad);
  add(b, cherry);
}
// поры в пепле
for (let i = 0; i < 16; i++){
  const a = Math.random() * Math.PI * 2;
  const rad = .02 + Math.random() * .13;
  const h = .175 * Math.sqrt(Math.max(0, 1 - Math.pow(rad / .175, 2))) * .9;
  const p = ball(.008 + Math.random() * .012, M.cherryB, 8);
  p.position.set(Math.cos(a) * rad, h + .012, Math.sin(a) * rad);
  cherry.add(p);
}
// обугленная кромка
const charCollar = new THREE.Mesh(new THREE.CylinderGeometry(.181, .176, .026, 36, 1, true), M.cherryB);
charCollar.position.y = -.010;
charCollar.castShadow = true;
cherry.add(charCollar);

// тлеющий уголёк
const ember = ball(.016, M.ember, 10);
ember.position.set(.055, .105, .115);
cherry.add(ember);
// светящееся пятно
const emberSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map:(function(){
    const {c, g} = cv(128, 128);
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, 'rgba(255,190,120,.95)');
    grd.addColorStop(.35, 'rgba(255,110,40,.55)');
    grd.addColorStop(1, 'rgba(255,80,20,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })(),
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
}));
emberSprite.scale.setScalar(.14);
emberSprite.position.set(.055, .10, .12);
cherry.add(emberSprite);

const emberLight = new THREE.PointLight(0xff7a2a, .9, .8, 2);
emberLight.position.set(.06, 1.55, .12);
hero.add(emberLight);

/* --- лицо --- */
const face = new THREE.Group();
hero.add(face);

// очки
function lensSide(sign){
  const g = new THREE.Group();
  const ry = -sign * .30;
  const frame = new THREE.Mesh(roundedBox(.150, .096, .026, .015, 3), M.black);
  frame.position.set(sign * .079, 0, bodyRadius(1.13) + .006);
  frame.rotation.y = ry;
  add(frame, g);

  const glass = new THREE.Mesh(roundedBox(.124, .072, .010, .009, 2), M.lens);
  glass.position.set(sign * .079, 0, bodyRadius(1.13) + .022);
  glass.rotation.y = ry;
  add(glass, g);

  // блик
  const gl = new THREE.Mesh(new THREE.BoxGeometry(.075, .012, .004),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.75}));
  gl.position.set(sign * .079 + .012, .012, bodyRadius(1.13) + .030);
  gl.rotation.set(0, ry, -.42);
  g.add(gl);
  const gl2 = gl.clone();
  gl2.scale.set(.55, .8, 1);
  gl2.position.set(sign * .079 + .028, -.008, bodyRadius(1.13) + .030);
  g.add(gl2);

  // заклёпка
  const rivet = cyl(.007, .007, .008, M.cream, 10);
  rivet.rotation.x = Math.PI / 2;
  rivet.position.set(sign * .142, .022, bodyRadius(1.13) + .012);
  g.add(rivet);

  // дужка
  const temple = box(.020, .020, .17, M.black, sign * .148, .004, .055, g);
  temple.rotation.y = sign * .22;
  return g;
}
const glasses = new THREE.Group();
glasses.position.y = 1.135;
glasses.add(lensSide(1), lensSide(-1));
const bridge = box(.040, .022, .020, M.black, 0, 0, bodyRadius(1.13) + .014, glasses);
face.add(glasses);

// брови
[-1, 1].forEach(function(sign){
  const b = new THREE.Mesh(roundedBox(.125, .034, .032, .015, 2), M.dark);
  b.position.set(sign * .079, 1.262, bodyRadius(1.27) - .002);
  b.rotation.set(0, -sign * .26, sign * .26);
  add(b, face);
});

// ухмылка
const mouth = new THREE.Group();
mouth.position.set(0, .965, bodyRadius(.965) - .012);
(function grin(){
  const s = new THREE.Shape();
  s.moveTo(-.120, .030);
  s.quadraticCurveTo(0, -.140, .120, .026);
  s.quadraticCurveTo(0, -.060, -.120, .030);
  const geo = new THREE.ExtrudeGeometry(s, {depth:.022, bevelEnabled:true, bevelSize:.006, bevelThickness:.006, bevelSegments:2, curveSegments:14});
  geo.translate(0, 0, -.011);
  const m = new THREE.Mesh(geo, M.black);
  m.castShadow = true;
  mouth.add(m);

  // верхний ряд зубов
  for (let i = 0; i < 3; i++){
    const t = rbox(.054, .042, .014, .009, M.white, (i - 1) * .058, -.032, .014);
    t.rotation.z = (i - 1) * -.05;
    mouth.add(t);
  }
  // нижний ряд
  for (let i = 0; i < 2; i++){
    const b = rbox(.050, .026, .012, .008, M.white, (i ? .029 : -.029), -.086, .012);
    mouth.add(b);
  }
  // верхняя губа-контур
  const lip = new THREE.Mesh(new THREE.TorusGeometry(.120, .009, 8, 28, Math.PI * .94), M.black);
  lip.rotation.z = Math.PI + .06;
  lip.position.set(0, .026, .004);
  mouth.add(lip);
})();
face.add(mouth);

/* --- руки --- */
function glove(dir, origin){
  const g = new THREE.Group();
  g.position.copy(origin);
  g.quaternion.setFromUnitVectors(_up, dir.clone().normalize());

  const cuff = cyl(.062, .054, .062, M.glove, 18);
  cuff.position.y = -.055;
  g.add(cuff);

  const palm = ball(.072, M.glove, 20);
  palm.scale.set(1, .95, .82);
  g.add(palm);

  for (let i = 0; i < 3; i++){
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(.024, .046, 4, 10), M.glove);
    f.position.set((i - 1) * .040, .075, .006);
    f.rotation.z = (i - 1) * -.30;
    f.castShadow = true;
    g.add(f);
  }
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(.026, .040, 4, 10), M.glove);
  thumb.position.set(-.062, .020, .030);
  thumb.rotation.z = .9;
  thumb.castShadow = true;
  g.add(thumb);
  return g;
}

[-1, 1].forEach(function(sign){
  const shoulder = new THREE.Vector3(sign * .150, 1.02, .015);
  const elbow = new THREE.Vector3(sign * .315, 1.14, .055);
  const wrist = new THREE.Vector3(sign * .410, 1.30, .075);
  const sh = ball(.045, M.limb, 16);
  sh.scale.set(1, .9, .9);
  sh.position.copy(shoulder);
  hero.add(sh);
  stick(shoulder.toArray(), elbow.toArray(), .021, M.limb, hero);
  stick(elbow.toArray(), wrist.toArray(), .019, M.limb, hero);
  const dir = new THREE.Vector3().subVectors(wrist, elbow);
  const g = glove(dir, wrist);
  hero.add(g);
});

/* --- ноги --- */
[-1, 1].forEach(function(sign){
  const hip = new THREE.Vector3(sign * .050, .42, .01);
  const ankle = new THREE.Vector3(sign * .118, .175, .035);
  stick(hip.toArray(), ankle.toArray(), .022, M.limb, hero);
});

/* --- кроссовки --- */
function sneaker(sign){
  const g = new THREE.Group();
  // подошва
  rbox(.220, .072, .392, .034, M.cream, 0, .036, .030, g);
  rbox(.200, .034, .360, .020, M.cream, 0, .072, .030, g);
  // верх
  rbox(.188, .118, .315, .044, M.shoe, 0, .142, -.010, g);
  // мысок
  rbox(.182, .088, .112, .038, M.white, 0, .108, .148, g);
  // пятка
  rbox(.176, .118, .075, .028, M.shoe, 0, .163, -.150, g);
  // воротник
  const collar = new THREE.Mesh(new THREE.TorusGeometry(.078, .024, 10, 22), M.shoe);
  collar.rotation.x = Math.PI / 2;
  collar.scale.set(1, .82, 1);
  collar.position.set(0, .205, -.055);
  add(collar, g);
  // язычок
  rbox(.088, .075, .026, .018, M.shoe, 0, .196, .048, g);
  // шнурки
  for (let i = 0; i < 3; i++){
    const l = rbox(.150, .030, .034, .012, M.white, 0, .196 + i * .024, .112 - i * .014, g);
    l.rotation.x = -.12;
  }
  // подушечка пятки
  rbox(.120, .030, .022, .012, M.cream, 0, .212, -.172, g);

  g.position.set(sign * .145, 0, .035);
  g.rotation.y = -sign * .34;
  hero.add(g);
}
sneaker(1);
sneaker(-1);

// контактные тени под обувью
[-1, 1].forEach(function(sign){
  const ct = new THREE.Mesh(new THREE.PlaneGeometry(.34, .5),
    new THREE.MeshBasicMaterial({map:softShadowTex(), transparent:true, opacity:.55, depthWrite:false}));
  ct.rotation.x = -Math.PI / 2;
  ct.position.set(sign * .145, .0615, .05);
  ct.renderOrder = 2;
  hero.add(ct);
});

/* --- дым --- */
const smoke = new THREE.Group();
scene.add(smoke);
const puffTex = (function(){
  const {c, g} = cv(128, 128);
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 62);
  grd.addColorStop(0, 'rgba(255,255,255,.98)');
  grd.addColorStop(.42, 'rgba(246,242,238,.62)');
  grd.addColorStop(.75, 'rgba(236,231,227,.22)');
  grd.addColorStop(1, 'rgba(230,226,222,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  // лёгкие «дольки» для пушистости
  for (let i = 0; i < 5; i++){
    const x = 40 + Math.random() * 48, y = 40 + Math.random() * 48, r = 18 + Math.random() * 16;
    const gg = g.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, 'rgba(255,255,255,.35)');
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  return new THREE.CanvasTexture(c);
})();
const blobs = [];
const N_SMOKE = 16;
for (let i = 0; i < N_SMOKE; i++){
  const mat = new THREE.SpriteMaterial({map:puffTex, color:0xbfb8b6, transparent:true, opacity:.7, depthWrite:false});
  const b = new THREE.Sprite(mat);
  b.userData = {t:i / N_SMOKE, speed:.15 + Math.random() * .04, sway:1 + Math.random() * .5, ph:Math.random() * 7};
  smoke.add(b);
  blobs.push(b);
}

/* --- подиум + контактная тень --- */
const stage = new THREE.Mesh(new THREE.CylinderGeometry(.60, .645, .06, 56), toon(0xf4f1ea));
stage.position.y = .03;
stage.castShadow = true; stage.receiveShadow = true;
scene.add(stage);
const stageRim = new THREE.Mesh(new THREE.TorusGeometry(.622, .014, 8, 64), toon(0xe2dbcd));
stageRim.rotation.x = Math.PI / 2;
stageRim.position.y = .058;
stageRim.castShadow = true;
scene.add(stageRim);

const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.05, .72),
  new THREE.MeshBasicMaterial({map:softShadowTex(), transparent:true, depthWrite:false}));
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.set(0, .062, .03);
shadowMesh.renderOrder = 1;
scene.add(shadowMesh);

/* ---------------------------------------------------------------- контуры */
(function outlines(){
  const list = [];
  scene.traverse(function(o){
    if (!o.isMesh || !o.material || !o.material.isMeshToonMaterial) return;
    if (o === shadowMesh) return;
    const geo = o.geometry;
    if (!geo || geo.type === 'PlaneGeometry') return;
    if (!geo.boundingSphere) geo.computeBoundingSphere();
    const r = geo.boundingSphere ? geo.boundingSphere.radius : 0;
    if (r < .012) return;
    list.push(o);
  });
  for (let i = 0; i < list.length; i++){
    const o = list[i];
    const ol = new THREE.Mesh(o.geometry, OUTLINE_MAT);
    ol.castShadow = false; ol.receiveShadow = false;
    o.add(ol);
  }
})();

/* ---------------------------------------------------------------- lights */
const hemi = new THREE.HemisphereLight(0xfff3ff, 0xffd9b0, 1.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff6ea, 2.0);
key.position.set(2.2, 3.4, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.6;
key.shadow.camera.right = 1.6;
key.shadow.camera.top = 2.2;
key.shadow.camera.bottom = -.4;
key.shadow.camera.near = .5;
key.shadow.camera.far = 9;
key.shadow.bias = -.0006;
key.shadow.normalBias = .02;
key.target.position.set(0, .8, 0);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xd8e6ff, .55);
fill.position.set(-2.6, 1.6, 2.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7f0, 1.0);
rim.position.set(-1.4, 2.2, -2.6);
scene.add(rim);

/* ---------------------------------------------------------------- camera */
const target = new THREE.Vector3(0, .92, 0);
const cam = {az:.20, pol:1.40, rad:3.95, taz:.20, tpol:1.40, trad:3.95};
let spin = false, smokeOn = true, heroSpin = 0;
let dragging = false, lastX = 0, lastY = 0, moved = 0, lastInteract = performance.now();

function applyCamera(){
  const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
  camera.position.set(
    target.x + cam.rad * sp * Math.sin(cam.az),
    target.y + cam.rad * cp,
    target.z + cam.rad * sp * Math.cos(cam.az)
  );
  camera.lookAt(target);
}

canvas.addEventListener('pointerdown', function(e){
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  lastInteract = performance.now();
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  cam.taz -= dx * .006;
  cam.tpol = Math.max(.35, Math.min(1.62, cam.tpol - dy * .004));
  lastInteract = performance.now();
});
canvas.addEventListener('pointerup', function(){
  dragging = false;
  canvas.classList.remove('dragging');
  if (moved < 8) puff();
  lastInteract = performance.now();
});
canvas.addEventListener('pointercancel', function(){ dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  cam.trad = Math.max(1.7, Math.min(5.0, cam.trad * (1 + e.deltaY * .0011)));
  lastInteract = performance.now();
}, {passive:false});

/* ---------------------------------------------------------------- interaction */
let puffT = 0;
function puff(){
  puffT = 1;
  blobs.forEach(function(b){ b.userData.t = Math.random() * .25; });
}

document.querySelector('.bar').addEventListener('click', function(e){
  const b = e.target.closest('button');
  const dot = e.target.closest('i[data-bg]');
  if (dot){ setBg(dot.dataset.bg); return; }
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'spin'){ spin = !spin; b.classList.toggle('on', spin); }
  if (a === 'smoke'){ smokeOn = !smokeOn; b.classList.toggle('on', smokeOn); smoke.visible = smokeOn; }
  lastInteract = performance.now();
});

const BGS = {
  peach:['#ffe9c7', '#ffe0ef', '#dfe8ff'],
  mint: ['#d8f6e8', '#d5f0ff', '#e6e2ff'],
  lilac:['#e8dcff', '#ffd9ec', '#d8e6ff'],
  night:['#2b2246', '#3a2a5e', '#201a38']
};
function setBg(name){
  const v = BGS[name] || BGS.peach;
  const root = document.documentElement.style;
  root.setProperty('--bg1', v[0]);
  root.setProperty('--bg2', v[1]);
  root.setProperty('--bg3', v[2]);
  const night = name === 'night';
  document.documentElement.style.setProperty('--ink', night ? '#f4ecff' : '#241a2e');
  document.documentElement.style.setProperty('--panel', night ? 'rgba(40,28,66,.62)' : 'rgba(255,255,255,.72)');
  document.documentElement.style.setProperty('--line', night ? 'rgba(255,255,255,.16)' : 'rgba(36,26,46,.14)');
  document.querySelectorAll('.dots i').forEach(function(d){ d.style.boxShadow = d.dataset.bg === name ? '0 0 0 2px rgba(255,122,61,.9)' : '0 1px 4px rgba(60,30,90,.3)'; });
  document.querySelectorAll('.bar button').forEach(function(x){ x.style.color = night ? '#f4ecff' : ''; });
}

addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  if (k === 'r'){ spin = !spin; document.querySelector('[data-act=spin]').classList.toggle('on', spin); }
  if (k === 's'){ smokeOn = !smokeOn; document.querySelector('[data-act=smoke]').classList.toggle('on', smokeOn); smoke.visible = smokeOn; }
  if (k === ' ') puff();
});

/* ---------------------------------------------------------------- resize */
function resize(){
  const w = canvas.clientWidth || innerWidth;
  const h = canvas.clientHeight || innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < .9 ? 44 : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let time = 0;

function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  time += dt;
  const ck = 1 - Math.pow(.0009, dt);

  // авто-вращение: крутится сам персонаж, камера остаётся «в лицо»
  if (spin && !dragging) heroSpin += dt * .22;
  hero.rotation.y = heroSpin;
  cam.az += (cam.taz - cam.az) * ck;
  cam.pol += (cam.tpol - cam.pol) * ck;
  cam.rad += (cam.trad - cam.rad) * ck;
  applyCamera();

  // лёгкое покачивание персонажа
  hero.position.y = .06 + Math.sin(time * 1.6) * .008;
  hero.rotation.z = Math.sin(time * .9) * .012;

  // тлеющий уголёк
  puffT = Math.max(0, puffT - dt * .8);
  const emberPulse = .85 + .15 * Math.sin(time * 3.4) + puffT * 1.4;
  emberLight.intensity = 1.4 * emberPulse;
  emberSprite.scale.setScalar(.12 * emberPulse);
  emberSprite.material.opacity = Math.min(1, .16 * emberPulse);

  // дым
  const speedBoost = 1 + puffT * 2.4;
  for (let i = 0; i < blobs.length; i++){
    const b = blobs[i], u = b.userData;
    u.t += dt * u.speed * speedBoost;
    if (u.t > 1) u.t -= 1;
    const t = u.t;
    b.position.set(
      Math.sin(t * 4.4 + u.ph) * (.04 + t * .15) * u.sway + .07,
      1.72 + t * .52,
      .11 + Math.cos(t * 3.2 + u.ph) * .06
    );
    const s = (.28 + t * .34) * (1 + puffT * .35);
    b.scale.set(s, s, s);
    const fade = Math.min(1, t / .10) * (1 - Math.pow(t, 1.8));
    b.material.opacity = Math.max(0, fade * .85);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.__m = {
  reset: function(az, pol, rad){
    heroSpin = 0; hero.rotation.y = 0; spin = false;
    cam.az = cam.taz = (az === undefined ? .18 : az);
    cam.pol = cam.tpol = (pol === undefined ? 1.42 : pol);
    cam.rad = cam.trad = (rad === undefined ? 3.2 : rad);
    document.querySelector('[data-act=spin]').classList.remove('on');
    applyCamera();
    return 'ok';
  },
  stats: function(){ return {draws:renderer.info.render.calls, tris:renderer.info.render.triangles, hero:heroSpin}; }
};

setBg('peach');
applyCamera();
requestAnimationFrame(frame);
})();
</script>
</body>
