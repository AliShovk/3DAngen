<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Газовая плита · 3D</title>
<style>
  :root{
    --ink:#f3ece2;
    --muted:rgba(243,236,226,.62);
    --panel:rgba(14,11,9,.56);
    --line:rgba(255,255,255,.13);
    --accent:#ff4fd8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0a0908;overflow:hidden}
  body{
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;filter:saturate(1.16) contrast(1.03)}
  #c.dragging{cursor:grabbing}
  #c.hot{cursor:pointer}

  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 40%, rgba(30,10,50,.24) 78%, rgba(30,10,50,.5) 100%),
      linear-gradient(to bottom, rgba(30,10,50,.16), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 74%, rgba(30,10,50,.26));
    mix-blend-mode:multiply;
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  .hud{
    position:fixed;top:0;left:0;padding:26px 30px;
    display:flex;flex-direction:column;gap:6px;
    pointer-events:none;
    opacity:0;animation:rise .9s .2s ease forwards;
  }
  .hud .kicker{
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,236,226,.78);
  }
  .hud .title{
    font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;
    text-shadow:0 2px 14px rgba(24,8,40,.55);
  }
  .hud .title em{font-style:normal;color:var(--accent)}
  .hud .sub{font-size:12.5px;color:rgba(243,236,226,.8);letter-spacing:.02em;text-shadow:0 1px 8px rgba(24,8,40,.5)}

  .bar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    padding:6px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px) saturate(1.1);
    -webkit-backdrop-filter:blur(14px) saturate(1.1);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.9);
    opacity:0;animation:rise .9s .45s ease forwards;
  }
  .bar button{
    appearance:none;border:0;background:transparent;color:var(--ink);
    font:inherit;font-size:12.5px;letter-spacing:.01em;
    padding:11px 15px;min-height:40px;border-radius:999px;cursor:pointer;
    transition:background .18s ease,color .18s ease;
    white-space:nowrap;
  }
  .bar button:hover{background:rgba(255,255,255,.09)}
  .bar button.on{background:rgba(255,79,216,.20);color:#ffc6f1;box-shadow:inset 0 0 0 1px rgba(255,79,216,.45)}
  .bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

  .hint{
    position:fixed;left:0;right:0;bottom:84px;
    text-align:center;font-size:11.5px;letter-spacing:.06em;color:rgba(24,8,40,.72);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    pointer-events:none;opacity:0;animation:rise 1s .7s ease forwards;
  }
  .hint kbd{
    font:inherit;color:rgba(243,236,226,.62);
    border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:1px 5px;margin:0 1px;
  }
  .lit{
    position:fixed;right:30px;top:26px;text-align:right;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(24,8,40,.66);
    pointer-events:none;opacity:0;animation:rise .9s .3s ease forwards;
  }
  .lit b{display:block;font-size:22px;letter-spacing:0;color:var(--ink);font-weight:600;margin-top:4px}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .bar{animation-name:riseBar}
  @keyframes riseBar{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  @media (max-width:720px){
    .hud{padding:18px 18px}
    .hud .title{font-size:20px}
    .hint{display:none}
    .lit{right:18px;top:18px}
    .lit b{font-size:17px}
    .bar{bottom:16px;padding:5px;gap:2px}
    .bar button{padding:10px 11px;font-size:11.5px;min-height:38px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="hud">
  <div class="kicker">3D-сцена</div>
  <div class="title">Маскот на плите</div>
  <div class="sub">Ходит по варочной панели и танцует</div>
</div>

<div class="lit">Горелки<br><b id="litCount">0 / 4</b></div>

<div class="hint">
  Тяните мышью — вращение · колесо — зум · клик по горелке — огонь · <kbd>W</kbd> ходит · <kbd>D</kbd> танцует · <kbd>S</kbd> стоит · <kbd>1</kbd>–<kbd>4</kbd> горелки
</div>

<div class="bar">
  <button data-act="walk" class="on">Ходит</button>
  <button data-act="dance">Танцует</button>
  <button data-act="idle">Стоит</button>
  <span class="sep"></span>
  <button data-act="all">Все горелки</button>
  <button data-act="off">Погасить</button>
  <span class="sep"></span>
  <button data-act="day" class="on">День</button>
  <button data-act="night">Вечер</button>
</div>

<script>/*__THREE__*/</script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- renderer */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .58;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 60);

/* ---------------------------------------------------------------- textures */
function cv(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return {c, g:c.getContext('2d')};
}
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 8;
  return t;
}
function noise(g, w, h, amt, alpha){
  for (let i = 0; i < amt; i++){
    g.fillStyle = 'rgba(' + (Math.random() < .5 ? '0,0,0,' : '255,255,255,') + (Math.random() * alpha) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}

/* мультяшная плитка-фартук: разноцветные «кабанчики» */
function tileTexture(){
  const {c, g} = cv(1024, 340);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 1024, 340);
  const palette = ['#c9b8ff', '#a8e8ff', '#ffe08a', '#ffb3d1', '#b7f5c0'];
  const cols = 5, rows = 5, tw = 1024 / cols, th = 340 / rows;
  for (let r = 0; r < rows; r++){
    for (let i = -1; i <= cols; i++){
      const off = (r % 2) ? tw * 0.5 : 0;
      const x = i * tw + off + 3, y = r * th + 3;
      g.fillStyle = palette[(r * 3 + i + 7) % palette.length];
      g.fillRect(x, y, tw - 6, th - 6);
      g.fillStyle = 'rgba(255,255,255,.28)';
      g.fillRect(x, y, tw - 6, 7);
    }
  }
  return tex(c, 6, 1.1);
}

/* камень столешницы */
function marbleTexture(){
  const {c, g} = cv(1024, 1024);
  g.fillStyle = '#e2ddd3'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 26; i++){
    const x = Math.random() * 1024, y = Math.random() * 1024, r = 90 + Math.random() * 260;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(206,200,190,.5)');
    grd.addColorStop(1, 'rgba(206,200,190,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 34; i++){
    let x = Math.random() * 1024, y = Math.random() * 1024;
    const a = Math.random() * Math.PI;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 12; s++){
      x += Math.cos(a + Math.sin(s) * .9) * 34;
      y += Math.sin(a + Math.cos(s * 1.3) * .9) * 34;
      g.lineTo(x, y);
    }
    g.strokeStyle = 'rgba(' + (120 + Math.random() * 40) + ',' + (116 + Math.random() * 40) + ',' + (108 + Math.random() * 40) + ',' + (.05 + Math.random() * .1) + ')';
    g.lineWidth = .6 + Math.random() * 2.4;
    g.stroke();
  }
  noise(g, 1024, 1024, 22000, .05);
  return tex(c, 1, 1);
}

/* дерево фасадов */
function woodTexture(){
  const {c, g} = cv(512, 512);
  const base = g.createLinearGradient(0, 0, 512, 0);
  base.addColorStop(0, '#6a4b33'); base.addColorStop(.5, '#7a5738'); base.addColorStop(1, '#63452f');
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 340; i++){
    const x = Math.random() * 512;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= 512; y += 32){
      g.lineTo(x + Math.sin(y * .02 + i) * (2 + Math.random() * 5), y);
    }
    g.strokeStyle = 'rgba(' + (Math.random() < .5 ? '38,24,14,' : '160,124,86,') + (Math.random() * .16) + ')';
    g.lineWidth = .5 + Math.random() * 2;
    g.stroke();
  }
  noise(g, 512, 512, 9000, .06);
  return tex(c, 1, 1);
}

/* пол — шахматка в мультяшном стиле */
function floorTexture(){
  const {c, g} = cv(512, 512);
  const cols = ['#fff4dc', '#7be0d0'];
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++){
    g.fillStyle = cols[(x + y) % 2];
    g.fillRect(x * 256, y * 256, 256, 256);
  }
  return tex(c, 14, 14);
}

/* шлифованный металл: карта шероховатости */
function brushedTexture(){
  const {c, g} = cv(512, 512);
  g.fillStyle = '#4a4a4a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1700; i++){
    const y = Math.random() * 512, v = 30 + Math.random() * 120 | 0;
    g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (.15 + Math.random() * .35) + ')';
    g.lineWidth = .5 + Math.random() * 1.7;
    g.beginPath(); g.moveTo(0, y); g.lineTo(512, y + (Math.random() - .5) * 4); g.stroke();
  }
  const t = tex(c, 3, 3);
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

/* градиент газового пламени: белый-голубой низ → синий → тёплый кончик */
function flameGradient(){
  const {c, g} = cv(32, 256);
  const grd = g.createLinearGradient(0, 256, 0, 0);
  grd.addColorStop(0.00, 'rgba(255,255,255,.98)');
  grd.addColorStop(0.22, 'rgba(255,255,255,.96)');
  grd.addColorStop(0.55, 'rgba(255,255,255,.88)');
  grd.addColorStop(0.82, 'rgba(255,255,255,.52)');
  grd.addColorStop(1.00, 'rgba(255,255,255,.22)');
  g.fillStyle = grd; g.fillRect(0, 0, 32, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* мягкое свечение */
function glowTexture(){
  const {c, g} = cv(256, 256);
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(.18, 'rgba(210,232,255,.85)');
  grd.addColorStop(.45, 'rgba(90,150,255,.32)');
  grd.addColorStop(1, 'rgba(40,90,220,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

/* вид за окном */
function skyTexture(kind){
  const {c, g} = cv(512, 512);
  if (kind === 'day'){
    const grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0, '#63d2ff'); grd.addColorStop(.62, '#b6ecff'); grd.addColorStop(1, '#ffe9b8');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    // солнце
    g.fillStyle = '#ffe066';
    g.beginPath(); g.arc(400, 110, 46, 0, 7); g.fill();
    // облака-«пузыри»
    for (let i = 0; i < 5; i++){
      const cx0 = 60 + i * 108, cy0 = 90 + (i % 3) * 60;
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(cx0, cy0, 26, 0, 7); g.arc(cx0 + 30, cy0 - 12, 32, 0, 7); g.arc(cx0 + 64, cy0 + 2, 24, 0, 7); g.fill();
    }
    // зелёные холмы
    g.fillStyle = '#7ee07a';
    g.beginPath(); g.moveTo(0, 512); g.lineTo(0, 400); g.quadraticCurveTo(140, 330, 280, 402); g.quadraticCurveTo(400, 460, 512, 392); g.lineTo(512, 512); g.fill();
    g.fillStyle = '#57c96b';
    g.beginPath(); g.moveTo(0, 512); g.lineTo(0, 452); g.quadraticCurveTo(160, 420, 330, 470); g.quadraticCurveTo(430, 500, 512, 462); g.lineTo(512, 512); g.fill();
  } else {
    const grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0, '#2b1c60'); grd.addColorStop(.6, '#4b2a86'); grd.addColorStop(1, '#7a3f9c');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    // луна
    g.fillStyle = '#ffe9a8';
    g.beginPath(); g.arc(390, 120, 44, 0, 7); g.fill();
    g.fillStyle = '#4b2a86';
    g.beginPath(); g.arc(368, 106, 38, 0, 7); g.fill();
    // звёзды
    for (let i = 0; i < 70; i++){
      const x = Math.random() * 512, y = Math.random() * 380;
      g.fillStyle = 'rgba(255,255,255,' + (.4 + Math.random() * .6) + ')';
      const r = 1 + Math.random() * 2.6;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    // тёмные холмы
    g.fillStyle = '#2a1a4d';
    g.beginPath(); g.moveTo(0, 512); g.lineTo(0, 420); g.quadraticCurveTo(150, 350, 300, 425); g.quadraticCurveTo(420, 480, 512, 415); g.lineTo(512, 512); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* окружение для отражений металла */
function envTexture(){
  const {c, g} = cv(1024, 512);
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#f4efe6'); grd.addColorStop(.42, '#cfc7ba'); grd.addColorStop(.55, '#b8afa2'); grd.addColorStop(1, '#4a4239');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  let bl = g.createRadialGradient(300, 210, 0, 300, 210, 210);
  bl.addColorStop(0, 'rgba(255,255,255,.95)'); bl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = bl; g.fillRect(60, 0, 500, 420);
  bl = g.createRadialGradient(800, 170, 0, 800, 170, 150);
  bl.addColorStop(0, 'rgba(255,214,160,.75)'); bl.addColorStop(1, 'rgba(255,214,160,0)');
  g.fillStyle = bl; g.fillRect(660, 20, 300, 320);
  g.fillStyle = 'rgba(24,21,18,.6)';
  g.fillRect(0, 286, 1024, 22);
  g.fillStyle = 'rgba(255,248,235,.5)';
  g.fillRect(0, 262, 1024, 5);
  g.fillStyle = 'rgba(30,26,22,.45)';
  for (let i = 0; i < 6; i++){
    g.fillRect(i * 180 + 40, 150, 34, 130);
  }
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const brushedTex = brushedTexture();
const glowTex = glowTexture();
const flameTex = flameGradient();

/* контактные тени-декали */
function aoDecal(w, d, x, z, opacity, y){
  const {c, g} = cv(256, 256);
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,.92)');
  grd.addColorStop(.55, 'rgba(0,0,0,.42)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({map:t, transparent:true, opacity:opacity, depthWrite:false, color:0x000000}));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y === undefined ? .0015 : y, z);
  m.renderOrder = 2;
  return m;
}
const skyDay = skyTexture('day');
const skyNight = skyTexture('night');

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromEquirectangular(envTexture());
scene.environment = envRT.texture;
pmrem.dispose();

/* ---------------------------------------------------------------- мультяшный шейдинг */
function toonRamp(){
  const stops = [58, 132, 205, 255];
  const data = new Uint8Array(stops.length * 4);
  for (let i = 0; i < stops.length; i++){
    data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = stops[i];
    data[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, stops.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const RAMP = toonRamp();
function toon(color, opts){
  return new THREE.MeshToonMaterial(Object.assign({color:color, gradientMap:RAMP}, opts || {}));
}

const OUTLINE_MAT = new THREE.ShaderMaterial({
  uniforms:{thickness:{value:.0032}, color:{value:new THREE.Color(0x2a1745)}},
  vertexShader:'uniform float thickness; void main(){ vec3 p = position + normal * thickness; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
  fragmentShader:'uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); }',
  side:THREE.BackSide
});

/* ---------------------------------------------------------------- materials */
const M = {
  steel:    toon(0xff5f73),      // корпус плиты — коралл
  steelDull:toon(0xe8475f),      // тёмный коралл
  brush:    toon(0xffe8c4),      // варочная поверхность — сливки
  blackGlass:toon(0x35215e),     // панель управления
  glass:    toon(0x2a1a4a),      // стекло духовки
  iron:     toon(0x35215e),      // чугунные решётки
  ironLight:toon(0x4a2f7a),
  knob:     toon(0xffd23f),      // жёлтые ручки
  wall:     toon(0xb4f0dd),      // мятные стены
  ceiling:  toon(0xfff6e4),
  marble:   toon(0xffeecb),      // столешница
  wood:     toon(0x4fd1c5),      // шкафы слева — бирюза
  wood2:    toon(0xff9f43),      // шкафы справа — апельсин
  wood3:    toon(0xffd23f),      // верхние шкафы — солнце
  wood4:    toon(0xff8fb1),      // верхние справа — роза
  floor:    toon(0xffffff, {map:floorTexture()}),
  tile:     toon(0xffffff, {map:tileTexture()}),
  ceramic:  toon(0xfff8ee),
  cloth:    toon(0x7ce0ff),
};

/* ---------------------------------------------------------------- geometry helpers */
function roundedBox(w, h, d, r, seg){
  r = Math.min(r, w * .49, h * .49, d * .49);
  seg = seg || 3;
  const s = new THREE.Shape();
  const hw = w / 2, hh = h / 2;
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + r);
  s.lineTo(hw, hh - r); s.quadraticCurveTo(hw, hh, hw - r, hh);
  s.lineTo(-hw + r, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - r);
  s.lineTo(-hw, -hh + r); s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  const depth = Math.max(d - 2 * r, .001);
  const g = new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled:true, bevelSize:r * .92, bevelThickness:r,
    bevelSegments:seg, curveSegments:8, steps:1
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}
function box(w, h, d, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, mat, seg){

function cabinets(sign){
  const g = new THREE.Group();
  const cx = sign * 1.83;
  const cabMat = sign < 0 ? M.wood : M.wood2;
  // корпус
  const body = box(3.03, .86, .56, cabMat, cx, .43, -.02);
  g.add(body);
  // фасады
  for (let i = 0; i < 2; i++){
    const dx = cx + (i ? .755 : -.755) * sign;
    const door = box(1.44, .80, .022, cabMat, dx, .45, .258);
    g.add(door);
    const h = cyl(.008, .008, .20, M.ceramic, 12);
    h.rotation.z = Math.PI / 2;
    h.position.set(dx + (i ? -.55 : .55), .76, .276);
    g.add(h);
  }
  // столешница
  const top = box(3.06, .042, .60, M.marble, cx, .90, 0);
  g.add(top);
  g.add(box(3.06, .007, .004, new THREE.MeshBasicMaterial({color:0x3a2450}), cx, .8765, .298));
  g.add(box(.004, .042, .60, new THREE.MeshBasicMaterial({color:0x3a2450}), cx + (cx > 0 ? -1.53 : 1.53), .90, 0));
  // плинтус
  g.add(box(3.0, .07, .5, new THREE.MeshBasicMaterial({color:0x3a2450}), cx, .035, -.05));

  // верхние шкафы
  if (sign < 0){
    g.add(upperRun(-1.83, 3.03, M.wood3));
  } else {
    g.add(upperRun(1.05, 1.34, M.wood4));
    g.add(windowUnit());
  }
  g.add(aoDecal(3.5, 1.05, cx, .04, .46));
  return g;
}

function upperRun(cx, width, cabMat){
  const g = new THREE.Group();
  g.add(box(width, .68, .34, cabMat, cx, 1.80, -.13));
  const dw = width / 2 - .012;
  for (let i = 0; i < 2; i++){
    const dx = cx + (i ? dw / 2 : -dw / 2);
    g.add(box(dw - .008, .64, .02, cabMat, dx, 1.80, .045));
    const h = cyl(.007, .007, .2, M.ceramic, 12);
    h.rotation.z = Math.PI / 2;
    h.position.set(dx + (i ? dw / 2 - .07 : -dw / 2 + .07), 1.51, .062);
    g.add(h);
  }
  const strip = new THREE.Mesh(new THREE.BoxGeometry(width - .08, .008, .03),
    new THREE.MeshBasicMaterial({color:0xffe9a8}));
  strip.position.set(cx, 1.452, .03);
  g.add(strip);
  return g;
}

const FLAME_COLORS = [0x00e5ff, 0x9dff3d, 0xffa62b, 0xb46bff];

const burners = [];
const pickables = [];

BURNERS.forEach(function(b, i){
  const FC = FLAME_COLORS[i % FLAME_COLORS.length];
  const FCL = new THREE.Color(FC).lerp(new THREE.Color(0xffffff), .58).getHex();

    const ang = a * Math.PI / 2;
    const arm = box(.098, .007, .011, M.iron, Math.cos(ang) * .046, 0, Math.sin(ang) * .046);

  const outM = flameOuterMat.clone(); outM.color.setHex(FC);
  const inM = flameInnerMat.clone(); inM.color.setHex(FCL);
  const tipM = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.92, blending:THREE.NormalBlending, depthWrite:true, side:THREE.DoubleSide});
  const tongues = [];
  const N = 22;
  for (let k = 0; k < N; k++){
    const ang = k / N * Math.PI * 2 + (Math.random() - .5) * .16;
    const rad = .0295 + Math.random() * .0055;
    const tall = .72 + Math.random() * .85;

    const t1 = new THREE.Mesh(new THREE.ConeGeometry(.0074, .096, 6, 1), outM);
    t1.position.set(Math.cos(ang) * rad, .034, Math.sin(ang) * rad);
    t1.rotation.z = -Math.cos(ang) * .30;
    t1.rotation.x = Math.sin(ang) * .30;
    t1.userData = {
      ph:Math.random() * 7, amp:(.76 + Math.random() * .5) * tall,
      wob:.05 + Math.random() * .07, bz:t1.rotation.z, bx:t1.rotation.x
    };
    flame.add(t1);
    tongues.push(t1);

    if (Math.random() < .42){
      const tip = new THREE.Mesh(new THREE.ConeGeometry(.0036, .034, 5, 1), tipM);
      tip.position.y = .060;
      t1.add(tip);
    }

    const t2 = new THREE.Mesh(new THREE.ConeGeometry(.0040, .044, 5, 1), inM);
    t2.position.set(Math.cos(ang) * rad, .017, Math.sin(ang) * rad);
    t2.rotation.z = -Math.cos(ang) * .22;
    t2.rotation.x = Math.sin(ang) * .22;
    t2.userData = {
      ph:Math.random() * 7, amp:.68 + Math.random() * .45,
      wob:.04 + Math.random() * .05, bz:t2.rotation.z, bx:t2.rotation.x
    };
    flame.add(t2);
    tongues.push(t2);
  }

  // свечение
  const glowA = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:FC, transparent:true, opacity:.34, blending:THREE.AdditiveBlending, depthWrite:false}));
  glowA.position.y = .022;
  glowA.scale.setScalar(.24);
  flame.add(glowA);
  const glowB = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xffffff, transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false}));
  glowB.position.y = .013;
  glowB.scale.setScalar(.055);
  flame.add(glowB);

  // свет от пламени
  const pl = new THREE.PointLight(FC, 0, .9, 2);
  pl.position.set(b.x, .95, b.z);
  stove.add(pl);

  // отблеск на нержавейке вокруг горелки
  const bounce = new THREE.Mesh(new THREE.PlaneGeometry(.34, .34),
    new THREE.MeshBasicMaterial({map:glowTex, color:FC, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
  bounce.rotation.x = -Math.PI / 2;
  bounce.position.set(b.x, .8695, b.z);
  bounce.renderOrder = 1;
  stove.add(bounce);

  // ручка
  const knob = new THREE.Group();
  knob.position.set(KNOB_X[i], .795, .313);
  const kb = cyl(.0225, .0235, .026, M.knob, 24);
  kb.rotation.x = Math.PI / 2;
  knob.add(kb);
  const kface = cyl(.019, .019, .004, M.ironLight, 24);
  kface.rotation.x = Math.PI / 2;
  kface.position.z = .014;
  knob.add(kface);
  const marker = box(.0035, .013, .004, toon(0x2a1745), 0, .010, .0165);
  knob.add(marker);
  knobGroup.add(knob);

  // попадание под клик
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .03, 12), new THREE.MeshBasicMaterial({visible:false}));
  hit.rotation.x = Math.PI / 2;
  hit.position.copy(knob.position);
  hit.position.z += .012;
  stove.add(hit);
  hit.userData.burner = i;
  pickables.push(hit);

  const hitBurner = new THREE.Mesh(new THREE.CylinderGeometry(.085, .085, .05, 12), new THREE.MeshBasicMaterial({visible:false}));
  hitBurner.position.set(b.x, .885, b.z);
  stove.add(hitBurner);
  hitBurner.userData.burner = i;
  pickables.push(hitBurner);

  burners.push({
    idx:i, flame, tongues, outM, inM, tipM, glowA, glowB, pl, knob, bounce,
    level:0, target:0, flash:0
  });
});

  const t = new THREE.CanvasTexture(c);

}

function buildMascot(){
  const S = {
    paper: toon(0xffffff, {map:mascotPaper()}),
    cA: toon(0x4a2a1c), cB: toon(0x33203a), cC: toon(0x5c3320), cD: toon(0x3b1f28),
    dark: toon(0x3a2318), black: toon(0x191520), lens: toon(0x1a1a26),
    white: toon(0xffffff), shoe: toon(0x1c1b22), cream: toon(0xfff3dd),
    limb: toon(0x6b4026), ember: new THREE.MeshBasicMaterial({color:0xff6a1e})
  };
  const root = new THREE.Group();
  root.userData.mascot = true;
  const bounce = new THREE.Group(); root.add(bounce);
  const torso = new THREE.Group(); bounce.add(torso);

  function madd(m, parent){
    m.castShadow = true; m.receiveShadow = true;
    (parent || torso).add(m);
    return m;
  }
  function mbox(w, h, d, mat, x, y, z, parent){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    return madd(m, parent);
  }
  function mrbox(w, h, d, r, mat, x, y, z, parent){
    const m = new THREE.Mesh(roundedBox(w, h, d, r), mat);
    m.position.set(x, y, z);
    return madd(m, parent);
  }
  function mball(r, mat, parent){
    return madd(new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), mat), parent);
  }
  function stickG(p1, p2, r, mat, parent){
    const a = new THREE.Vector3().fromArray(p1);
    const b = new THREE.Vector3().fromArray(p2);
    const dir = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 12), mat);
    m.position.copy(a).addScaledVector(dir, .5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    m.castShadow = true;
    parent.add(m);
    return m;
  }
  const rAt = function(y){ return .112 + (.185 - .112) * Math.min(1, Math.max(0, (y - .40) / 1.05)); };

  /* тело */
  const bg = new THREE.CylinderGeometry(.185, .112, 1.05, 26, 10);
  (function(){
    const pos = bg.attributes.position;
    for (let i = 0; i < pos.count; i++){
      const y = pos.getY(i), t = (y + .525) / 1.05;
      pos.setX(i, pos.getX(i) + Math.sin(t * Math.PI) * .014);
      pos.setZ(i, pos.getZ(i) * (.93 + .07 * t));
    }
    pos.needsUpdate = true; bg.computeVertexNormals();
  })();
  const body = new THREE.Mesh(bg, S.paper);
  body.position.y = .925;
  madd(body, torso);

  /* верхушка */
  const cherry = new THREE.Group();
  cherry.position.y = 1.44;
  torso.add(cherry);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.188, 24, 12, 0, Math.PI * 2, 0, Math.PI * .58), S.cA);
  dome.scale.set(1, .95, 1); dome.castShadow = true;
  cherry.add(dome);
  const buds = [S.cA, S.cB, S.cC, S.cD];
  for (let i = 0; i < 18; i++){
    const a = i / 18 * Math.PI * 2 + Math.random() * .4;
    const rad = .19 * (.35 + Math.random() * .62);
    const hh = .19 * Math.sqrt(Math.max(0, 1 - Math.pow(rad / .19, 2))) * .95;
    const b = mball(.028 + Math.random() * .036, buds[i % 4], cherry);
    b.position.set(Math.cos(a) * rad, hh * (.6 + Math.random() * .5), Math.sin(a) * rad);
  }
  const ember = mball(.03, S.ember, cherry);
  ember.position.set(.05, .105, .115);
  const emberSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xffa050, transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false}));
  emberSprite.scale.setScalar(.22);
  emberSprite.position.set(.05, .10, .12);
  cherry.add(emberSprite);
  const emberLight = new THREE.PointLight(0xff8a3a, .9, .5, 2);
  emberLight.position.set(.05, .11, .12);
  cherry.add(emberLight);

  /* лицо */
  [-1, 1].forEach(function(sign){
    const ry = -sign * .30;
    const frame = mrbox(.152, .100, .036, .017, S.black, sign * .079, 1.135, rAt(1.135) + .006, torso);
    frame.rotation.y = ry;
    const glass = mrbox(.126, .076, .012, .010, S.lens, sign * .079, 1.135, rAt(1.135) + .022, torso);
    glass.rotation.y = ry;
    const gl = mbox(.075, .012, .004, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.75}), sign * .079 + .012, 1.147, rAt(1.135) + .030, torso);
    gl.rotation.set(0, ry, -.42);
    const gl2 = mbox(.042, .010, .004, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.6}), sign * .079 + .026, 1.127, rAt(1.135) + .030, torso);
    gl2.rotation.set(0, ry, -.42);
    const rivet = new THREE.Mesh(new THREE.CylinderGeometry(.007, .007, .008, 10), S.cream);
    rivet.rotation.x = Math.PI / 2;
    rivet.position.set(sign * .142, 1.157, rAt(1.135) + .012);
    madd(rivet, torso);
    const temple = mbox(.020, .020, .17, S.black, sign * .148, 1.139, .055, torso);
    temple.rotation.y = sign * .22;
    const brow = mrbox(.125, .034, .032, .015, S.dark, sign * .079, 1.272, rAt(1.28) - .004, torso);
    brow.rotation.set(0, -sign * .26, sign * .26);
  });
  const bridge = mbox(.040, .022, .020, S.black, 0, 1.135, rAt(1.135) + .014, torso);

  /* ухмылка */
  const mouth = new THREE.Group();
  mouth.position.set(0, .965, rAt(.965) - .012);
  torso.add(mouth);
  (function(){
    const sh = new THREE.Shape();
    sh.moveTo(-.098, .026);
    sh.quadraticCurveTo(0, -.115, .098, .026);
    sh.quadraticCurveTo(0, -.052, -.098, .026);
    const geo = new THREE.ExtrudeGeometry(sh, {depth:.022, bevelEnabled:true, bevelSize:.006, bevelThickness:.006, bevelSegments:2, curveSegments:12});
    geo.translate(0, 0, -.011);
    const m = new THREE.Mesh(geo, S.black);
    m.castShadow = true;
    mouth.add(m);
    for (let i = 0; i < 2; i++){
      const t = mrbox(.072, .042, .014, .010, S.white, (i ? 1 : -1) * .040, -.030, .014, mouth);
      t.rotation.z = (i ? -1 : 1) * .10;
    }
  })();

  /* руки */
  function armGroup(sign){
    const g = new THREE.Group();
    g.position.set(sign * .150, 1.02, .015);
    const sh = mball(.045, S.limb, g);
    sh.scale.set(1, .9, .9);
    stickG([0, 0, 0], [sign * .165, .12, .04], .021, S.limb, g);
    stickG([sign * .165, .12, .04], [sign * .260, .28, .06], .019, S.limb, g);
    // перчатка на конце
    const dir = new THREE.Vector3(sign * .095, .16, .02).normalize();
    const hand = new THREE.Group();
    hand.position.set(sign * .260, .28, .06);
    hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    g.add(hand);
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(.062, .054, .062, 16), S.white);
    cuff.position.y = -.055; madd(cuff, hand);
    const palm = mball(.072, S.white, hand);
    palm.scale.set(1, .95, .82);
    for (let i = 0; i < 3; i++){
      const f = new THREE.Mesh(new THREE.CapsuleGeometry(.024, .046, 4, 8), S.white);
      f.position.set((i - 1) * .040, .075, .006);
      f.rotation.z = (i - 1) * -.30;
      f.castShadow = true;
      hand.add(f);
    }
    const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(.026, .040, 4, 8), S.white);
    thumb.position.set(-.062, .020, .030);
    thumb.rotation.z = .9;
    thumb.castShadow = true;
    hand.add(thumb);
    return g;
  }
  const armL = armGroup(-1), armR = armGroup(1);
  torso.add(armL, armR);

  /* кроссовок */
  function sneaker(){
    const g = new THREE.Group();
    mrbox(.215, .062, .385, .032, S.cream, 0, .031, .030, g);
    mrbox(.200, .034, .360, .020, S.cream, 0, .072, .030, g);
    mrbox(.188, .118, .315, .044, S.shoe, 0, .142, -.010, g);
    mrbox(.182, .088, .112, .038, S.white, 0, .108, .148, g);
    mrbox(.176, .118, .075, .028, S.shoe, 0, .163, -.150, g);
    const collar = new THREE.Mesh(new THREE.TorusGeometry(.078, .024, 8, 18), S.shoe);
    collar.rotation.x = Math.PI / 2;
    collar.scale.set(1, .82, 1);
    collar.position.set(0, .205, -.055);
    madd(collar, g);
    mrbox(.088, .075, .026, .018, S.shoe, 0, .196, .048, g);
    for (let i = 0; i < 4; i++){
      const l = mrbox(.128, .022, .030, .010, S.white, 0, .198 + i * .018, .092 - i * .012, g);
      l.rotation.x = -.12;
    }
    mrbox(.120, .030, .022, .012, S.cream, 0, .212, -.172, g);
    return g;
  }

  /* ноги */
  function legGroup(sign){
    const g = new THREE.Group();
    g.position.set(sign * .050, .42, .01);
    stickG([0, 0, 0], [sign * .068, -.245, .025], .022, S.limb, g);
    const sh = sneaker();
    sh.position.set(sign * .068, -.42, .025);
    sh.rotation.y = -sign * .22;
    g.add(sh);
    return g;
  }
  const legL = legGroup(-1), legR = legGroup(1);
  bounce.add(legL, legR);

  /* дым из верхушки */
  const smoke = new THREE.Group();
  smoke.position.y = .14;
  cherry.add(smoke);
  const puffTex = (function(){
    const {c, g} = cv(128, 128);
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 62);
    grd.addColorStop(0, 'rgba(255,255,255,.98)');
    grd.addColorStop(.42, 'rgba(246,242,238,.62)');
    grd.addColorStop(.78, 'rgba(236,231,227,.2)');
    grd.addColorStop(1, 'rgba(230,226,222,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  const blobs = [];
  for (let i = 0; i < 10; i++){
    const mat = new THREE.SpriteMaterial({map:puffTex, color:0xd8d0dc, transparent:true, opacity:.5, depthWrite:false});
    const sp = new THREE.Sprite(mat);
    sp.userData = {t:i / 10, sp:.16 + Math.random() * .05, sw:1 + Math.random() * .5, ph:Math.random() * 7};
    smoke.add(sp);
    blobs.push(sp);
  }

  // контактная тень
  const shadowTex = (function(){
    const t = cv(128, 64);
    const grd = t.g.createRadialGradient(64, 32, 0, 64, 32, 60);
    grd.addColorStop(0, 'rgba(32,12,46,.9)');
    grd.addColorStop(.5, 'rgba(32,12,46,.45)');
    grd.addColorStop(1, 'rgba(38,18,54,0)');
    t.g.fillStyle = grd; t.g.fillRect(0, 0, 128, 64);
    return new THREE.CanvasTexture(t.c);
  })();
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(.74, .56),
    new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:.8, depthWrite:false}));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = .004;
  shadow.renderOrder = 3;
  root.add(shadow);

  return {root, bounce, torso, cherry, armL, armR, legL, legR, smoke, blobs, emberSprite, emberLight};
}

const MV = {mode:'walk', z:.25, dir:1, phase:0, danceT:0, yaw:0, spin:0};
const PATH = {front:.255, back:.075};
const pose = {aLx:0, aLz:0, aRx:0, aRz:0, lLx:0, lRx:0, tY:0, tZ:0, tX:0, bY:0};

function mascotMode(m){
  MV.mode = m;
  MV.phase = 0;
  MV.danceT = 0;
  document.querySelectorAll('[data-act="walk"],[data-act="dance"],[data-act="idle"]').forEach(function(b){
    b.classList.toggle('on', b.dataset.act === m);
  });
}

function updateMascot(dt, time){
  const T = {aLx:0, aLz:.10, aRx:0, aRz:-.10, lLx:0, lRx:0, tY:0, tZ:0, tX:0, bY:0};
  let yawTarget = MV.yaw;

  if (MV.mode === 'walk'){
    MV.z += MV.dir * .055 * dt;
    if (MV.z > PATH.front){ MV.z = PATH.front; MV.dir = -1; }
    if (MV.z < PATH.back){ MV.z = PATH.back; MV.dir = 1; }
    MV.phase += dt * 8.4;
    const s = Math.sin(MV.phase);
    T.lLx = s * .78; T.lRx = -s * .78;
    T.aLx = -s * .55; T.aRx = s * .55;
    T.aLz = .12; T.aRz = -.12;
    T.bY = Math.abs(Math.sin(MV.phase)) * .022;
    T.tY = s * .12;
    T.tZ = Math.sin(MV.phase * 2) * .04;
    T.tX = .07;
    yawTarget = MV.dir > 0 ? 0 : Math.PI;
    MV.yaw = yawTarget;
  } else if (MV.mode === 'dance'){
    MV.danceT += dt;
    const cyc = 2.4;
    const move = Math.floor(MV.danceT / cyc) % 4;
    const u = (MV.danceT % cyc) / cyc * Math.PI * 2;
    if (move === 0){        // покачивание
      T.aLz = .55 + Math.sin(u) * .45;
      T.aRz = -.55 + Math.sin(u) * .45;
      T.tY = Math.sin(u) * .32;
      T.tZ = Math.sin(u) * .12;
      T.bY = Math.abs(Math.sin(u * 2)) * .022;
      T.lLx = Math.sin(u * 2) * .12;
      T.lRx = -Math.sin(u * 2) * .12;
    } else if (move === 1){ // прыжки
      T.bY = Math.abs(Math.sin(u * 2)) * .085;
      T.lLx = .5; T.lRx = .5;
      T.aLz = .85; T.aRz = -.85;
      T.tZ = Math.sin(u * 2) * .06;
    } else if (move === 2){ // юла
      MV.spin += dt * 5.2;
      T.aLz = 1.05; T.aRz = -1.05;
      T.tZ = .05;
      T.bY = Math.abs(Math.sin(u * 3)) * .02;
      yawTarget = MV.yaw;
    } else {                // робот
      const sq = Math.sin(u * 2) > 0 ? 1 : 0;
      T.aLz = sq ? .95 : .05;
      T.aRz = sq ? -.05 : -.95;
      T.lLx = sq ? .18 : 0;
      T.lRx = sq ? 0 : .18;
      T.tZ = Math.sin(u * 3) * .06;
      T.bY = .012;
    }
  } else {                  // стоит
    T.bY = Math.sin(time * 1.8) * .008;
    T.tZ = Math.sin(time * 1.1) * .02;
    T.aLz = .12 + Math.sin(time * 1.3) * .05;
    T.aRz = -.12 - Math.sin(time * 1.3) * .05;
  }

  // плавное применение
  const k = 1 - Math.pow(.0006, dt);
  for (const key in T) pose[key] += (T[key] - pose[key]) * k;

  MC.armL.rotation.x = pose.aLx; MC.armL.rotation.z = pose.aLz;
  MC.armR.rotation.x = pose.aRx; MC.armR.rotation.z = pose.aRz;
  MC.legL.rotation.x = pose.lLx; MC.legR.rotation.x = pose.lRx;
  MC.torso.rotation.y = pose.tY; MC.torso.rotation.z = pose.tZ; MC.torso.rotation.x = pose.tX;
  MC.bounce.position.y = pose.bY;

  let y = MV.yaw;
  if (MV.mode === 'dance' && Math.floor(MV.danceT / 2.4) % 4 === 2) y = MV.spin;
  MC.root.rotation.y = y;
  MC.root.position.set(0, .869, MV.z);

  // уголёк
  const pulse = .8 + .2 * Math.sin(time * 3.2);
  MC.emberLight.intensity = .9 * pulse;
  MC.emberSprite.scale.setScalar(.22 * pulse);

  // дым
  for (let i = 0; i < MC.blobs.length; i++){
    const b = MC.blobs[i], u = b.userData;
    u.t += dt * u.sp;
    if (u.t > 1) u.t -= 1;
    const t = u.t;
    b.position.set(Math.sin(t * 4.4 + u.ph) * (.05 + t * .16) * u.sw, t * .62, Math.cos(t * 3.2 + u.ph) * .06);
    const sc = (.22 + t * .3);
    b.scale.set(sc, sc, sc);
    const fade = Math.min(1, t / .12) * (1 - Math.pow(t, 1.9));
    b.material.opacity = Math.max(0, fade * .6);
  }
}

(function outlines(){
  const thin = OUTLINE_MAT;
  const thick = OUTLINE_MAT.clone();
  thick.uniforms.thickness.value = .014;
  function inMascot(o){
    let p = o;
    while (p){ if (p.userData && p.userData.mascot) return true; p = p.parent; }
    return false;
  }
  const list = [];
  scene.traverse(function(o){
    if (!o.isMesh || !o.material || !o.material.isMeshToonMaterial) return;
    const geo = o.geometry;
    if (!geo || geo.type === 'PlaneGeometry') return;
    if (!geo.boundingSphere) geo.computeBoundingSphere();
    const r = geo.boundingSphere ? geo.boundingSphere.radius : 0;
    if (r < .016) return;
    list.push(o);
  });
  for (let i = 0; i < list.length; i++){
    const o = list[i];
    const mascotPart = inMascot(o);
    const ol = new THREE.Mesh(o.geometry, mascotPart ? thick : thin);
    ol.castShadow = false;
    ol.receiveShadow = false;
    o.add(ol);
  }
})();

const stripLight2 = new THREE.PointLight(0xffd6a0, .6, 2.0, 2);
stripLight2.position.set(1.05, 1.42, .1);
scene.add(stripLight2);

/* ---------------------------------------------------------------- lighting presets */
const PRESET = {
  day:   {hemi:.40, key:1.45, keyCol:0xfff8ea, fill:.20, win:2.4, spot:9, spotCol:0xfff8ea, pend:1.6, strip:.5, exposure:.58, sky:skyDay, env:1},
  night: {hemi:.10, key:.10, keyCol:0x8fa6ff, fill:.06, win:1.0, spot:4, spotCol:0xffb877, pend:5.5, strip:2.0, exposure:.72, sky:skyNight, env:.35}
};
const cur = {hemi:.40, key:1.45, fill:.20, win:2.4, spot:9, pend:1.6, strip:.5, exposure:.58, env:1};
let mode = 'day';
const keyColNow = new THREE.Color(0xfff2e0);
const keyColTarget = new THREE.Color(0xfff2e0);
const spotColNow = new THREE.Color(0xfff2e2);
const spotColTarget = new THREE.Color(0xfff2e2);

function setMode(m){
  mode = m;
  const p = PRESET[m];
  keyColTarget.setHex(p.keyCol);
  spotColTarget.setHex(p.spotCol);
  winMat.map = p.sky;
  winMat.needsUpdate = true;
  document.querySelectorAll('[data-act="day"],[data-act="night"]').forEach(function(b){
    b.classList.toggle('on', b.dataset.act === m);
  });
}

/* ---------------------------------------------------------------- camera control */
const target = new THREE.Vector3(0, .96, .03);
const cam = {az:.56, pol:1.22, rad:1.68, taz:.56, tpol:1.22, trad:1.68};
let dragging = false, lastX = 0, lastY = 0, moved = 0, lastInteract = performance.now();

function applyCamera(){
  const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
  camera.position.set(
    target.x + cam.rad * sp * Math.sin(cam.az),
    target.y + cam.rad * cp,
    target.z + cam.rad * sp * Math.cos(cam.az)
  );
  camera.lookAt(target);
}

canvas.addEventListener('pointerdown', function(e){
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  lastInteract = performance.now();
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function(e){
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    cam.taz -= dx * .0055;
    cam.tpol = Math.max(.40, Math.min(1.46, cam.tpol - dy * .004));
    lastInteract = performance.now();
  } else {
    hoverTest(e);
  }
});
canvas.addEventListener('pointerup', function(e){
  dragging = false;
  canvas.classList.remove('dragging');
  if (moved < 8) pickAt(e);
  lastInteract = performance.now();
});
canvas.addEventListener('pointercancel', function(){ dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  cam.trad = Math.max(1.05, Math.min(3.1, cam.trad * (1 + e.deltaY * .0011)));
  lastInteract = performance.now();
}, {passive:false});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function hitBurner(e){
  const r = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object.userData.burner : -1;
}
function hoverTest(e){
  canvas.classList.toggle('hot', hitBurner(e) >= 0);
}
function pickAt(e){
  const i = hitBurner(e);
  if (i >= 0) toggleBurner(i);
}

/* ---------------------------------------------------------------- audio */
let actx = null;
function audioCtx(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  return actx;
}
function clickSound(on){
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime;
  // щелчок
  const nb = ac.createBuffer(1, 1200, ac.sampleRate);
  const data = nb.getChannelData(0);
  for (let i = 0; i < data.length; i++){
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 6);
  }
  const src = ac.createBufferSource(); src.buffer = nb;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.1;
  const g1 = ac.createGain(); g1.gain.value = .22;
  src.connect(bp); bp.connect(g1); g1.connect(ac.destination);
  src.start(t0);

  if (on){
    // мягкий "пуф" газа
    const nb2 = ac.createBuffer(1, ac.sampleRate * .45, ac.sampleRate);
    const d2 = nb2.getChannelData(0);
    for (let i = 0; i < d2.length; i++){
      const k = i / d2.length;
      d2[i] = (Math.random() * 2 - 1) * Math.exp(-k * 5) * (1 - Math.exp(-k * 60));
    }
    const s2 = ac.createBufferSource(); s2.buffer = nb2;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g2 = ac.createGain(); g2.gain.value = .11;
    s2.connect(lp); lp.connect(g2); g2.connect(ac.destination);
    s2.start(t0 + .02);
  }
}

/* ---------------------------------------------------------------- state */
let hoverIdx = -1;
function toggleBurner(i){
  const b = burners[i];
  b.target = b.target > .5 ? 0 : 1;
  if (b.target > .5) b.flash = 1;
  clickSound(b.target > .5);
  updateCount();
}
function setAll(v){
  burners.forEach(function(b){
    if (v && b.target < .5) b.flash = 1;
    b.target = v ? 1 : 0;
  });
  clickSound(v);
  updateCount();
}
function updateCount(){
  const n = burners.filter(function(b){ return b.target > .5; }).length;
  document.getElementById('litCount').textContent = n + ' / 4';
}

document.querySelector('.bar').addEventListener('click', function(e){
  const b = e.target.closest('button');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'all') setAll(true);
  else if (a === 'off') setAll(false);
  else if (a === 'walk' || a === 'dance' || a === 'idle') mascotMode(a);
  else if (a === 'day' || a === 'night') setMode(a);
  lastInteract = performance.now();
});

addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') toggleBurner(parseInt(k, 10) - 1);
  else if (k === 'a') setAll(true);
  else if (k === 'r' || k === '0') setAll(false);
  else if (k === 'w') mascotMode('walk');
  else if (k === 'd') mascotMode('dance');
  else if (k === 's') mascotMode('idle');
});

mascotMode('walk');

/* стартовое состояние: две горелки */
burners[1].target = 1;
burners[2].target = 1;
burners.forEach(function(b){ b.level = b.target; });
updateCount();

/* ---------------------------------------------------------------- resize */
function resize(){
  if (REC || FRAMES){
    renderer.setPixelRatio(1);
    renderer.setSize(FW, FH, false);
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    camera.aspect = FW / FH;
    camera.fov = 40;
    camera.updateProjectionMatrix();
    return;
  }
  const w = canvas.clientWidth || innerWidth;
  const h = canvas.clientHeight || innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // на узких экранах отводим камеру дальше
  camera.fov = w / h < .9 ? 52 : 42;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();


/* ---------------------------------------------------------------- видео: смена ракурсов + запись */
var PARAMS = new URLSearchParams(location.search);
var FPORT = +(PARAMS.get('port') || 8766);
var FW = +(PARAMS.get('w') || 1280), FH = +(PARAMS.get('h') || 720);
var REC = PARAMS.has('rec');
var FRAMES = PARAMS.has('frames');
var CINE = REC || FRAMES || PARAMS.has('cine');
if (REC || FRAMES) resize();

const SHOTS = [
  {t0:0.00, t1:0.95, a0: .88, a1: .44, p0:1.20, p1:1.14, r0:2.45, r1:2.05, y0:.88, y1:.96},
  {t0:0.95, t1:1.75, a0: .08, a1: .30, p0:1.36, p1:1.26, r0:1.52, r1:1.38, y0:1.03, y1:1.00},
  {t0:1.75, t1:2.55, a0:-.62, a1:-.28, p0:1.18, p1:1.10, r0:1.60, r1:1.46, y0:.99, y1:.97},
  {t0:2.55, t1:3.40, a0: .34, a1: .82, p0: .92, p1: .86, r0:1.72, r1:1.58, y0:1.06, y1:1.03},
  {t0:3.40, t1:4.30, a0:0.92, a1:0.78, p0:1.10, p1:1.46, r0:1.62, r1:1.38, y0:1.01, y1:1.02},
  {t0:4.30, t1:5.00, a0: .70, a1: .56, p0:1.02, p1:1.20, r0:1.56, r1:2.40, y0:1.00, y1:.94}
];

function cineCam(t){
  let shot = SHOTS[SHOTS.length - 1];
  for (let i = 0; i < SHOTS.length; i++){
    if (t >= SHOTS[i].t0 && t < SHOTS[i].t1){ shot = SHOTS[i]; break; }
  }
  const u = Math.min(1, Math.max(0, (t - shot.t0) / (shot.t1 - shot.t0)));
  const e = u * u * (3 - 2 * u);
  cam.az  = cam.taz  = shot.a0 + (shot.a1 - shot.a0) * e;
  cam.pol = cam.tpol = shot.p0 + (shot.p1 - shot.p0) * e;
  cam.rad = cam.trad = shot.r0 + (shot.r1 - shot.r0) * e;
  target.y = shot.y0 + (shot.y1 - shot.y0) * e;
  applyCamera();
}

let recStart = 0, recStopped = false;
function beginRecording(){
  // все горелки для цвета
  setAll(true);
  const stream = canvas.captureStream(30);
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  let mime = '';
  for (let i = 0; i < types.length; i++){ if (window.MediaRecorder && MediaRecorder.isTypeSupported(types[i])){ mime = types[i]; break; } }
  const chunks = [];
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond: 12000000});
  rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = function(){
    const blob = new Blob(chunks, {type:mime || 'video/webm'});
    const fr = new FileReader();
    fr.onload = function(){
      window.__videoData = fr.result;
      window.__videoReady = mime;
      document.title = 'VIDEO_READY';
      // сохраняем файл (в превью-панели это уходит в Downloads)
      try {
        const a = document.createElement('a');
        a.href = fr.result;
        a.download = 'mascot-5s.webm';
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ a.remove(); }, 4000);
      } catch (e){}
    };
    fr.readAsDataURL(blob);
  };
  rec.start();
  recStart = performance.now();
  window.__rec = rec;
  setTimeout(function(){ if (!recStopped){ recStopped = true; rec.stop(); } }, 5150);
}

/* ---------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let time = 0;

let recClock = 0;
const cineMode = {init:false};
function stepFrame(dt){
  const k = 1 - Math.pow(.0016, dt);   // сглаживание, независимое от fps

  // свет: плавный переход день/вечер
  const p = PRESET[mode];
  cur.hemi += (p.hemi - cur.hemi) * k;
  cur.key += (p.key - cur.key) * k;
  cur.fill += (p.fill - cur.fill) * k;
  cur.win += (p.win - cur.win) * k;
  cur.spot += (p.spot - cur.spot) * k;
  cur.env += (p.env - cur.env) * k;
  cur.pend += (p.pend - cur.pend) * k;
  cur.strip += (p.strip - cur.strip) * k;
  cur.exposure += (p.exposure - cur.exposure) * k;

  keyColNow.lerp(keyColTarget, k);
  spotColNow.lerp(spotColTarget, k);
  keyLight.color.copy(keyColNow);
  studioSpot.color.copy(spotColNow);
  hemi.intensity = cur.hemi;
  keyLight.intensity = cur.key;
  fillLight.intensity = cur.fill;
  winLight.intensity = cur.win;
  studioSpot.intensity = cur.spot;
  pendantLight.intensity = cur.pend;
  stripLight.intensity = cur.strip;
  stripLight2.intensity = cur.strip * .85;
  renderer.toneMappingExposure = cur.exposure;
  if (Math.abs(cur.env - appliedEnv) > .004){
    appliedEnv = cur.env;
    for (let mi = 0; mi < envMats.length; mi++) envMats[mi].m.envMapIntensity = envMats[mi].base * appliedEnv;
  }

  // огонь
  for (let i = 0; i < burners.length; i++){
    const b = burners[i];
    const speed = b.target > .5 ? .085 : .16;
    b.level += (b.target - b.level) * (1 - Math.pow(1 - speed, dt * 60));
    b.flash = Math.max(0, b.flash - dt * 3.4);

    const vis = b.level > .015;
    b.flame.visible = vis;
    if (vis){
      const lv = b.level;
      const base = .6 + .4 * lv;
      const flick = .94 + .06 * Math.sin(time * 15 + i * 2.1) + .035 * Math.sin(time * 29 + i * .7);
      b.flame.scale.set(base, base * flick, base);
      b.flame.rotation.y += dt * .5;

      const tongues = b.tongues;
      for (let t = 0; t < tongues.length; t++){
        const o = tongues[t];
        const u = o.userData;
        const s = u.amp * (.74 + .30 * Math.sin(time * 8.5 + u.ph) + .16 * Math.sin(time * 21 + u.ph * 1.7));
        o.scale.set(1 + .10 * Math.sin(time * 11 + u.ph), s * lv, 1 + .10 * Math.sin(time * 11 + u.ph));
        o.rotation.z = u.bz + Math.sin(time * 6.3 + u.ph) * u.wob;
        o.rotation.x = u.bx + Math.cos(time * 5.1 + u.ph) * u.wob * .8;
      }
      b.outM.opacity = .97 * lv;
      b.inM.opacity = 1 * lv;
      b.tipM.opacity = .9 * lv;
      b.bounce.material.opacity = .17 * lv;
      b.glowA.material.opacity = .30 * lv * (.9 + .1 * Math.sin(time * 21 + i));
      b.glowB.material.opacity = .8 * lv;
      b.glowA.scale.setScalar((.30 + .05 * Math.sin(time * 13 + i)) * base);
      b.glowB.scale.setScalar((.10 + .02 * Math.sin(time * 17 + i)) * base);
      b.pl.intensity = (1.9 + .7 * Math.sin(time * 19 + i * 1.7)) * lv + b.flash * 5;
    } else {
      b.pl.intensity = 0;
      b.bounce.material.opacity = 0;
    }
    b.knob.rotation.z = -(1.15 * b.level);
  }

  // маскот
  updateMascot(dt, time);

  // камера
  if (CINE){
    cineCam(time);
  } else {
    if (!dragging && performance.now() - lastInteract > 3200){
      cam.taz += dt * .045;
    }
    const ck = 1 - Math.pow(.0009, dt);
    cam.az += (cam.taz - cam.az) * ck;
    cam.pol += (cam.tpol - cam.pol) * ck;
    cam.rad += (cam.trad - cam.rad) * ck;
    applyCamera();
  }

}

function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if (REC){
    recClock = (performance.now() - recStart) / 1000;
    time = Math.max(0, Math.min(5.2, recClock));
    if (recClock > 2.15 && MV.mode !== 'dance' && !recStopped) mascotMode('dance');
  } else {
    time += dt;
  }
  stepFrame(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---- рендер последовательности кадров и отправка на локальный сервер ---- */
let WS = null;
function openWS(){
  try {
    WS = new WebSocket('ws://127.0.0.1:' + FPORT);
    document.title = 'WS_INIT';
    WS.onopen = function(){ document.title = 'WS_OPEN'; try { WS.send('HELLO'); } catch (e){} };
    WS.onerror = function(){ document.title = 'WS_FAIL'; };
  } catch (e){ WS = null; }
}

async function renderFrames(fps, seconds){
  document.title = 'FR_START';
  const total = Math.round(fps * seconds);
  MV.z = .25; MV.dir = 1; MV.phase = 0; MV.danceT = 0; MV.yaw = 0; MV.spin = 0;
  setAll(true);
  mascotMode('walk');
  let t = 0;
  const dt = 1 / 120;
  for (let f = 0; f < total; f++){
    const target = f / fps;
    while (t < target - 1e-6){
      time = t;
      stepFrame(dt);
      t += dt;
      if (t > 2.15 && MV.mode !== 'dance') mascotMode('dance');
    }
    time = target;
    cineCam(time);
    renderer.render(scene, camera);
    document.title = 'FR_' + f;
    const data = canvas.toDataURL('image/jpeg', .92);
    try {
      if (WS && WS.readyState === 1){
        WS.send('FRAME ' + f + ' ' + data);
        await new Promise(function(r){ setTimeout(r, 8); });
      } else {
        await fetch('http://127.0.0.1:8765/frame?i=' + f, {method:'POST', body:data});
      }
    } catch (err){
      document.title = 'FRAME_ERR ' + f;
      return;
    }
  }
  document.title = 'FRAMES_DONE';
}

// все материалы с IBL — чтобы гасить отражения вечером
let appliedEnv = 1;
const envMats = [];
(function collect(){
  const seen = new Set();
  scene.traverse(function(o){
    if (!o.material) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for (let i = 0; i < list.length; i++){
      const m = list[i];
      if (!m || !m.isMeshStandardMaterial || seen.has(m.uuid)) continue;
      seen.add(m.uuid);
      envMats.push({m:m, base:(m.envMapIntensity === undefined ? 1 : m.envMapIntensity)});
    }
  });
})();

window.__stove = {
  project: function(x, y, z){
    const v = new THREE.Vector3(x, y, z).project(camera);
    return {x:(v.x + 1) / 2 * canvas.clientWidth, y:(1 - v.y) / 2 * canvas.clientHeight};
  },
  burner: function(i){ return this.project(BURNERS[i].x, .888, BURNERS[i].z); },
  knob: function(i){ return this.project(KNOB_X[i], .795, .325); },
  lit: function(){ return burners.map(function(b){ return b.target; }); },
  state: function(){ return {mode:mode, hemi:hemi.intensity, key:keyLight.intensity, spot:studioSpot.intensity, spotCol:studioSpot.color.getHexString(), pend:pendantLight.intensity, win:winLight.intensity, exp:renderer.toneMappingExposure, drawCalls:renderer.info.render.calls, tris:renderer.info.render.triangles}; }
};

setMode('day');
applyCamera();
if (FRAMES){
  openWS();
  setTimeout(function(){ renderFrames(+(PARAMS.get('fps') || 30), +(PARAMS.get('sec') || 5)); }, 900);
} else if (REC){
  setTimeout(beginRecording, 900);
} else if (CINE){
  setInterval(function(){ if (time > 5.0) time = 0; }, 200);
}
if (!FRAMES) requestAnimationFrame(frame);
})();
</script>
